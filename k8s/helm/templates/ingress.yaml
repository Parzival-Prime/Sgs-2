apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sgs-2-ingress
spec:
  ingressClassName: nginx

  rules:
      - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
              port:
                number: 3000
          
          - path: /api
            pathType: prefix
            backend: 
              service: 
                name: backend-service
              port:
                number: 8000
