apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  label:
    app: backend
    purpose: learning
  annotations:
    purpose: "Implementing a simple CI/CD pipeline to deploy a simple application"
spec:
  replicas: {{ .Values.backendDeployment.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: go-backend
          image: "{{ .Values.backendDeployment.image.repository }}@{{ .Values.backendDeployment.image.digest }}"
          ports:
            containerPort: 8000
        