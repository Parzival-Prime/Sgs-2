name: CI-CD

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7.0.1
      
      - name: Build and Push Backend image
        id: build-push-backend
        uses: cloudposse/github-action-docker-build-push@v3.2.2
        with:
          workdir: backend
          registry: registry.hub.docker.com
          organization: ${{ secrets.DOCKER_USERNAME }}
          repository: "sgs-2-go-backend"
          tags: |
            "v1"
          login: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          platforms: linux/amd64
        

      - name: Build and Push Frontend image
        id: build-push-frontend
        uses: cloudposse/github-action-docker-build-push@v3.2.2
        with:
          workdir: frontend
          image_name: 
          registry: registry.hub.docker.com
          organization: ${{ secrets.DOCKER_USERNAME }}
          repository: "sgs-2-next-frontend"
          tags: |
            "v1"
          login: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          platforms: linux/amd64
        
      
      - name: Logging the digests
        run: |
          echo "Backend Image Digest: ${{ steps.build-push-backend.outputs.digest }}"
          echo "Frontend Image Digest: ${{ steps.build-push-frontend.outputs.digest }}"
  
    outputs: 
      frontendDigest: ${{ steps.build-push-frontend.outputs.digest }}
      backendDigest: ${{ steps.build-push-backend.outputs.digest }}

  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1 
      
      - name: Azure login
        uses: azure/login@v2
        with: 
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Verify Azure login
        run: az account show

      - name: Create Terraform Backend
        run: |
          chmod +x scripts/create-backend.sh
          ./scripts/create-backend.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1         
      
      - name: Terraform Initialization
        working-directory: terraform
        run: terraform init

      - name: Terraform Validation
        working-directory: terraform
        run: terraform validate
      
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan
      
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply --auto-approve

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group sgs-2-rg \
            --name sgs-2-aks-cluster \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: 'latest'
      
      - name: Verify Helm
        run: helm version

      - name: Helm Upgrade
        run: |
          helm upgrade --install app-v1 ./k8s/helm \
          --set backendDeployment.image.digest="${{ needs.build.outputs.backendDigest }}" \
          --set frontendDeployment.image.digest="${{ steps.build.outputs.frontendDigest }}"
  
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs:
      - build
      - terraform
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1

      - name: Sleep
        run: sleep 1m 
      
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Initialization
        working-directory: terraform
        run: terraform init

      - name: Destroy Terraform provisioned resources
        working-directory: terraform
        run: terraform destroy --auto-approve

      - name: Destroy Terraform Backend
        run: |
          chmod +x scripts/destroy-backend.sh
          ./scripts/destroy-backend.sh