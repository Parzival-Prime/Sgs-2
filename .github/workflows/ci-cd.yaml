name: CI-CD

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Backend
        run: docker build -t parzivalprime/sgs-2-go-backend:v1 ./backend
      
      - name: Build Frontend
        run: docker build -t parzivalprime/sgs-2-next-frontend:v1 ./frontend
      
      - name: Push Backend
        run: docker push parzivalprime/sgs-2-go-backend:v1
      
      - name: Push Frontend
        run: docker push parzivalprime/sgs-2-next-frontend:v1
  
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      
      - name: Azure login
        uses: azure/login@v2
        with: 
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Terraform Backend
        run: |
          chmod +x scripts/create-backend.sh
          ./scripts/create-backend.sh
      
      - name: Terraform Initialization
        working-directory: terraform
        run: terraform init

      - name: Terraform Validation
        working-directory: terraform
        run: terraform validate
      
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan
      
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply --auto-approve
  
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Sleep
        run: sleep 2m

      - name: Destroy Terraform provisioned resources
        working-directory: terraform
        run: terraform destroy --auto-approve

      - name: Destroy Terraform Backend
        run: ./scripts/destroy-backed.sh